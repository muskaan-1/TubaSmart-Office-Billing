spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tubasmart}
    username: postgres
    password: 123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: 29efe7de33ed2eb09f7683e34cccbdb06f1732a5651031285532c8b0c3001be5
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  bootstrap-admin:
    username: admin
    password: Admin@123
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
