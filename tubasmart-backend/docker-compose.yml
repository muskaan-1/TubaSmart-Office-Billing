services:
  postgres:
    image: postgres:16
    container_name: tubasmart-postgres
    environment:
      POSTGRES_DB: tubasmart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tubasmart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tubasmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: tubasmart-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tubasmart
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or .env file}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  tubasmart_pgdata:
